---
deployment:
  tasks:
    - export DEPLOYPATH=/home/karw6956/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R $(pwd)/* $DEPLOYPATH/
    - /bin/cp -R $(pwd)/.[^.]* $DEPLOYPATH/ 2>/dev/null || true
    - /bin/chmod -R 755 $DEPLOYPATH/ 2>/dev/null || true
    - /bin/find $DEPLOYPATH -type f -name "*.php" -exec /bin/chmod 644 {} \; 2>/dev/null || true
